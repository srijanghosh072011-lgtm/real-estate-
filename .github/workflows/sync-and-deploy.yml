name: Sync listings and rebuild pages

on:
  schedule:
    # Twice an hour matches how often CREA DDF® boards refresh.
    - cron: '5,35 * * * *'
  workflow_dispatch:

# Deliberately not triggered by push: this job pushes a commit itself, which
# would retrigger it. Pages redeploys on that commit on its own.

permissions:
  contents: write

concurrency:
  group: sync-and-deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull listings from the MLS feed
        if: ${{ vars.DDF_URL != '' }}
        env:
          DDF_URL: ${{ vars.DDF_URL }}
          DDF_USER: ${{ secrets.DDF_USER }}
          DDF_PASS: ${{ secrets.DDF_PASS }}
          DDF_AGENT_ID: ${{ vars.DDF_AGENT_ID }}
        run: node scripts/sync-listings.mjs

      - name: Rebuild the pages committed at the repository root
        # GitHub Pages serves this branch directly, so new listing data is not
        # live until the generated pages are regenerated and committed too.
        run: npm run pages

      - name: Verify
        run: node build.mjs && node scripts/check.mjs

      - name: Commit listings and regenerated pages
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "listing-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -A
            git commit -m "chore: sync listings from MLS feed and rebuild pages"
            git push
          else
            echo "nothing changed"
          fi

